[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice-assistant"
version = "0.1.0"
description = "Real-time, autonomous AI Desktop Voice Assistant inspired by J.A.R.V.I.S. for Windows 11"
authors = [{ name = "Principal AI Systems Architect" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "colorama>=0.4.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "edge-tts>=6.1.12",
    "psutil>=5.9.8",
    "pycaw>=20240209",
    "comtypes>=1.4.1",
    "pywin32>=306",
    "mss>=9.0.1",
    "Pillow>=10.3.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "BLE001",
    "S110",
    "G201",
    "RUF059",
    "F401",
    "SIM117",
    "SIM102",
]
